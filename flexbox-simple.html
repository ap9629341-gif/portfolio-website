<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Simple Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .flex-container {
            display: flex;              /* Parent becomes flex container */
            justify-content: space-between; /* Children spacing */
            align-items: center;         /* Vertical alignment */
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .flex-item {
            background: #3b82f6;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎮 Flexbox - Parent Controls Children!</h1>
    
    <div class="flex-container">
        <div class="flex-item">Child 1</div>
        <div class="flex-item">Child 2</div>
        <div class="flex-item">Child 3</div>
    </div>
    
    <p><strong>Parent says:</strong> "Children, arrange side-by-side with space between!"</p>
    <p><strong>Children say:</strong> "Okay parent, we follow your rules!"</p>
</body>
</html>
